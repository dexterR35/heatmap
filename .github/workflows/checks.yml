name: local-release-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm release:check
      - run: pnpm audit --prod --audit-level=low
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm admin bootstrap-local
      - run: pnpm seed
      - run: pnpm start > /tmp/heatmap-server.log 2>&1 &
      - run: node scripts/wait-server.mjs
      - run: pnpm capture
      - run: pnpm test:e2e
      - run: pnpm verify:links
