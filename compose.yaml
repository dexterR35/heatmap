name: netbet-heatmap-local
services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: heatmap
      POSTGRES_USER: heatmap_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatmap_local -d heatmap"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]
  app:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://heatmap_local:${POSTGRES_PASSWORD:-}@db:5432/heatmap
      DATA_DIR: /app/.local
      CONTAINER_LOCAL_PROFILE: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:4173:4173"
    volumes:
      - reference_data:/app/.local
    networks: [private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  bootstrap:
    image: node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
    profiles: [tools]
    working_dir: /workspace
    volumes: [".:/workspace"]
    entrypoint: ["node", "scripts/bootstrap.mjs"]
networks:
  private:
    driver: bridge
volumes:
  postgres_data:
  reference_data:
